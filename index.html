<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テトリス</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&display=swap" rel="stylesheet">

<style>
body {
  background: radial-gradient(circle, #0f2027, #203a43, #2c5364);
  color: white;
  text-align: center;
  font-family: 'Orbitron', sans-serif;
}

#container {
  display: flex;
  justify-content: center;
  gap: 20px;
}

canvas {
  background: #111;
  border: 2px solid #0ff;
  box-shadow: 0 0 20px #0ff;
  border-radius: 10px;
}

#controls button {
  font-size: 24px;
  padding: 15px;
  margin: 5px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>テトリス</h1>

<p>スコア: <span id="score">0</span></p>
<p>ハイスコア: <span id="highscore">0</span></p>
<p>レベル: <span id="level">1</span></p>

<div id="container">
  <canvas id="game" width="240" height="400"></canvas>

  <div>
    <p>Next</p>
    <canvas id="next" width="80" height="80"></canvas>

    <p>Hold</p>
    <canvas id="hold" width="80" height="80"></canvas>
  </div>
</div>

<div id="controls">
  <button onclick="playerMove(-1)">⬅️</button>
  <button onclick="playerMove(1)">➡️</button>
  <button onclick="playerRotate()">🔄</button>
  <button onclick="playerDrop()">⬇️</button>
  <button onclick="hardDrop()">⚡</button>
</div>

<script src="game.js"></script>
</body>
</html>
